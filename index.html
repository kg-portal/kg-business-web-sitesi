<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KG Business Test</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f4f6f8;color:#111}
    .box{background:#fff;padding:32px 28px;border-radius:20px;box-shadow:0 12px 35px rgba(0,0,0,.12);text-align:center;width:min(88vw,460px)}
    h1{margin:0 0 12px;font-size:34px}
    p{margin:0 0 18px;font-size:18px;color:#555}
    .ok{display:inline-block;padding:10px 16px;border-radius:999px;background:#111;color:#fff;font-weight:700}
  </style>
</head>
<body>
  <div class="box">
    <h1>KG Business</h1>
    <p>Test sayfası başarıyla açıldı.</p>
    <div class="ok">Çalışıyor ✓</div>
  </div>
</body>
</html>
